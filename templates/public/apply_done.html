<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Received — {{ BIZ }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='akye.css') }}" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", sans-serif; background: var(--ground); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border-radius: 16px; border: 1px solid var(--line); padding: 48px 36px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 8px 40px rgba(15,7,40,0.09); }
    .script { font-family: "Allura", cursive; font-size: 1.8rem; color: var(--amber); display: block; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:3rem;margin-bottom:16px">🎉</div>
    <h1 style="font-size:1.4rem;font-weight:700;margin-bottom:10px">Application Received!</h1>
    <p style="color:var(--muted);line-height:1.7">Thank you, <strong>{{ name }}</strong>! We've received your application and will review it within 2 business days. We'll reach out by phone or email if you're a great fit.</p>
    <p style="color:var(--softer);font-size:0.88rem;margin-top:16px">Questions? Call us at {{ BIZ_PHONE }}.</p>
    <span class="script">{{ BIZ }}</span>
  </div>
</body>
</html>
