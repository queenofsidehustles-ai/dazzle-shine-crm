<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training & Supply Guide — {{ biz }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='akye.css') }}" />
  <style>
    body { font-family: Inter, -apple-system, sans-serif; background:var(--ground); margin:0; color:var(--ink); }
    .wrap { max-width:640px; margin:0 auto; padding:24px 16px 60px; }
    .hero { background:linear-gradient(135deg,var(--ink),var(--ink-2)); border-radius:14px; padding:28px 24px; text-align:center; }
    .hero h1 { color:var(--amber); margin:0 0 6px; font-size:1.4rem; }
    .hero p { color:var(--info-soft); margin:0; font-size:0.9rem; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px; margin-top:16px; }
    pre.guide { white-space:pre-wrap; word-wrap:break-word; font-family:Inter,-apple-system,sans-serif;
                font-size:0.92rem; line-height:1.7; color:var(--info); margin:0; }
    .back { display:inline-block; margin-top:18px; color:var(--info); text-decoration:none; font-size:0.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>Training & Supply Guide 📚</h1>
      <p>Everything you need for a great first cleaning with {{ biz }}</p>
    </div>
    <div class="card">
      <pre class="guide">{{ guide_html|safe }}</pre>
    </div>
    <div style="margin-top:18px">
      <a href="{{ url_for('sops.library') }}" target="_blank" style="display:inline-block;background:var(--ink);color:var(--amber);padding:11px 22px;border-radius:8px;font-weight:700;text-decoration:none;font-size:0.9rem">📋 See our detailed Cleaning SOPs →</a>
    </div>
    <a class="back" href="{{ url_for('contractors.onboarding_hub', token=s.agreement_token) }}">← Back to onboarding</a>
  </div>
</body>
</html>
