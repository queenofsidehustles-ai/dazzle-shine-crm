<style>
  .ops-scroll { overflow-x:auto; }
  .ops-dim { font-size:var(--t-xs); color:var(--softer); }
  .ops-bad { color:var(--warn); font-weight:700; font-size:var(--t-sm); margin-right:var(--s2); }
  .ops-good { color:var(--good); font-weight:700; font-size:var(--t-sm); }
  .ops-badge { display:inline-block; padding:2px 9px; border-radius:var(--r-pill);
               font-size:var(--t-xs); font-weight:700; text-transform:uppercase;
               letter-spacing:.05em; background:var(--line-soft); color:var(--muted); }
  .ops-badge.ops-active, .ops-badge.ops-ok { background:var(--good-soft); color:var(--good); }
  .ops-badge.ops-suspended, .ops-badge.ops-stale, .ops-badge.ops-never
    { background:var(--amber-soft); color:var(--amber-deep); }
  .ops-badge.ops-closed, .ops-badge.ops-closing, .ops-badge.ops-failing
    { background:var(--warn-soft); color:var(--warn); }
  .ops-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
              gap:var(--s3); margin-bottom:var(--s5); }
  .ops-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
              padding:var(--s4); }
  .ops-card .v { font-size:1.25rem; font-weight:700; display:block; }
  .ops-h { font-size:1.05rem; margin:var(--s6) 0 var(--s3); }
  .ops-actions { display:flex; gap:var(--s3); flex-wrap:wrap; align-items:flex-end; }
  .ops-actions form { display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap; }
  .ops-actions input[type=text] { min-width:220px; }
  table.ops-matrix th { min-width:92px; line-height:1.3; }
  table.ops-matrix td:first-child, table.ops-matrix th:first-child { white-space:nowrap; min-width:0; }
  pre.ops-detail { white-space:pre-wrap; font-size:var(--t-xs); color:var(--muted); margin:var(--s1) 0 0; }
</style>
