{# The setup chat. Everything the assistant says is inserted as text, never as
   markup. A Save card posts only its token; what gets saved is what the card
   showed (setup_assistant.confirm). #}
<style>
  .sa-card{max-width:660px;margin-bottom:18px;padding:0;overflow:hidden}
  .sa-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line, var(--border))}
  .sa-head h3{margin:0;font-size:1rem}
  .sa-head small{color:var(--softer)}
  .sa-head button{margin-left:auto;background:none;border:0;color:var(--softer);font-size:0.8rem;cursor:pointer}
  .sa-log{max-height:440px;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
  .sa-msg{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.55;white-space:pre-wrap;font-size:0.95rem}
  .sa-bot{background:var(--amber-soft, var(--gold-soft));align-self:flex-start;border-bottom-left-radius:4px}
  .sa-me{background:var(--info-soft, var(--border));align-self:flex-end;border-bottom-right-radius:4px}
  .sa-box{align-self:flex-start;max-width:88%;border:1px solid var(--amber-line, var(--gold));box-shadow:0 1px 3px rgba(22,33,58,.06);border-radius:12px;padding:12px 14px;background:var(--surface, #fff)}
  .sa-box b{display:block;margin-bottom:6px}
  .sa-box div{font-size:0.9rem;color:var(--muted);line-height:1.5}
  .sa-box .btn-primary{margin-top:10px}
  .sa-box .sa-note{margin-top:8px;font-weight:600}
  .sa-link{align-self:flex-start}
  .sa-form{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line, var(--border))}
  .sa-form input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line, var(--border));border-radius:10px;font:inherit;font-size:16px}
  .sa-dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--softer);animation:sa-b 1s infinite}
  .sa-dots i:nth-child(2){animation-delay:.15s}.sa-dots i:nth-child(3){animation-delay:.3s}
  .sa-form .btn-primary{flex:0 0 auto}
  @media (max-width:520px){.sa-head small{display:none}.sa-log{padding:14px 12px}.sa-form{padding:10px 12px}.sa-msg,.sa-box{max-width:94%}}
  @keyframes sa-b{0%,80%,100%{opacity:.3}40%{opacity:1}}
</style>

<div class="card sa-card" id="sa">
  <div class="sa-head">
    <h3>Set up with {{ assistant_name }}</h3>
    <small>Nothing saves until you tap the button</small>
    <button type="button" id="sa-reset">Start over</button>
  </div>
  <div class="sa-log" id="sa-log" aria-live="polite"></div>
  <form class="sa-form" id="sa-form">
    <input id="sa-q" autocomplete="off" placeholder="Type your answer or a question…" aria-label="Your message">
    <button class="btn-primary" type="submit">Send</button>
  </form>
</div>

<script>
(function () {
  const log = document.getElementById('sa-log');
  const URLS = {
    ask: '{{ url_for("setup_assistant.ask") }}',
    confirm: '{{ url_for("setup_assistant.confirm") }}',
    reset: '{{ url_for("setup_assistant.reset") }}',
  };
  const history = {{ chat | tojson }};

  function scroll() { log.scrollTop = log.scrollHeight; }

  function bubble(text, who) {
    const d = document.createElement('div');
    d.className = 'sa-msg ' + (who === 'user' ? 'sa-me' : 'sa-bot');
    d.textContent = text || '';
    log.appendChild(d);
    scroll();
    return d;
  }

  function linkCard(c) {
    // Only same-site paths. The href comes from a fixed list on the server,
    // and this keeps it that way even if something upstream changed.
    const h = c.href || '';
    if (h.charAt(0) !== '/' || h.charAt(1) === '/' || h.charAt(1) === '\\') return;
    const a = document.createElement('a');
    a.className = 'btn-primary sa-link';
    a.href = c.href;
    a.textContent = (c.label || 'Open') + ' →';
    log.appendChild(a);
  }

  function confirmCard(c) {
    const box = document.createElement('div');
    box.className = 'sa-box';
    const t = document.createElement('b');
    t.textContent = c.title || 'Check this';
    box.appendChild(t);
    (c.lines || []).forEach(function (l) {
      const row = document.createElement('div');
      row.textContent = l;
      box.appendChild(row);
    });
    if (c.done) {
      const note = document.createElement('div');
      note.className = 'sa-note';
      note.textContent = c.done;
      box.appendChild(note);
      log.appendChild(box);
      return;
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-primary';
    btn.textContent = c.label || 'Save';
    btn.addEventListener('click', async function () {
      btn.disabled = true;
      btn.textContent = 'Saving…';
      let data;
      try {
        data = await post(URLS.confirm, { token: c.token });
      } catch (e) {
        // Nothing reached the server, so the card is still good: let them retry.
        btn.disabled = false;
        btn.textContent = c.label || 'Save';
        return;
      }
      btn.remove();
      const note = document.createElement('div');
      note.className = 'sa-note';
      note.textContent = (data.ok ? '✅ ' : '⚠️ ') + (data.say || '');
      box.appendChild(note);
      if (data.ok) {
        if (data.follow) bubble(data.follow, 'assistant');
        (data.cards || []).forEach(render);
        updateProgress(data.progress);
      }
      scroll();
    });
    box.appendChild(btn);
    log.appendChild(box);
  }

  function render(c) {
    if (!c) return;
    if (c.kind === 'confirm') confirmCard(c);
    else if (c.kind === 'link') linkCard(c);
  }

  // Things a person may hit: an expired login or a blocked request comes back
  // as an HTML page, not JSON, and deserves its own sentence.
  async function post(url, body) {
    const r = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    const type = r.headers.get('Content-Type') || '';
    if (!r.ok || type.indexOf('application/json') === -1) {
      return { ok: false, cards: [],
               say: 'Your login may have timed out. Refresh the page and sign in again.' };
    }
    return r.json();
  }

  // The checklist under the chat is server-rendered. Swap in a fresh copy
  // rather than reloading, so nothing typed or offered in the chat is lost.
  async function updateProgress(p) {
    if (!p) return;
    if (p.done >= p.total) { window.setTimeout(function () { window.location.reload(); }, 2500); return; }
    try {
      const r = await fetch(window.location.href, { headers: { 'Accept': 'text/html' } });
      const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
      const fresh = doc.getElementById('gs-list');
      const old = document.getElementById('gs-list');
      if (fresh && old) old.replaceWith(fresh);
    } catch (e) {}
  }

  history.forEach(function (m) {
    if (m.hidden) return;
    if (m.content) bubble(m.content, m.role);
    (m.cards || []).forEach(render);
  });
  scroll();

  document.getElementById('sa-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const box = document.getElementById('sa-q');
    const q = box.value.trim();
    const send = this.querySelector('button[type=submit]');
    if (!q || send.disabled) return;
    send.disabled = true;
    box.value = '';
    bubble(q, 'user');
    const wait = document.createElement('div');
    wait.className = 'sa-msg sa-bot sa-dots';
    wait.setAttribute('aria-label', 'Thinking');
    wait.innerHTML = '<i></i><i></i><i></i>';
    log.appendChild(wait);
    scroll();
    let data;
    try {
      data = await post(URLS.ask, { q: q });
    } catch (err) {
      data = { say: 'Could not reach it just then. Try again.', cards: [] };
    }
    send.disabled = false;
    wait.remove();
    bubble(data.say, 'assistant');
    (data.cards || []).forEach(render);
    scroll();
  });

  document.getElementById('sa-reset').addEventListener('click', async function () {
    try { await fetch(URLS.reset, { method: 'POST' }); } catch (e) {}
    window.location.reload();
  });

})();
</script>
