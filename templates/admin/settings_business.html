{% extends "base_admin.html" %}
{% block title %}Business Settings — Dazzle & Shine CRM{% endblock %}
{% block page_title %}Business Settings{% endblock %}

{% block content %}
<div class="card">
  <p style="color:#9a95ad;font-size:0.9rem;margin-bottom:20px">This is your white-label config. Change the business name, phone, and contact info here — no code needed.</p>
  <form method="POST">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="form-group" style="grid-column:1/-1">
        <label>Business Name</label>
        <input type="text" name="business_name" value="{{ current.business_name }}" placeholder="Dazzle & Shine Maids" />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" value="{{ current.phone }}" placeholder="(689) 999-0194" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ current.email }}" placeholder="bookings@yourbusiness.com" />
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Address</label>
        <input type="text" name="address" value="{{ current.address }}" placeholder="123 Main St" />
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" name="city" value="{{ current.city }}" placeholder="Orlando" />
      </div>
      <div class="form-group">
        <label>State</label>
        <input type="text" name="state" value="{{ current.state }}" placeholder="FL" />
      </div>
      <div class="form-group">
        <label>ZIP Code</label>
        <input type="text" name="zip_code" value="{{ current.zip_code }}" placeholder="32801" />
      </div>
      <div class="form-group">
        <label>Website</label>
        <input type="text" name="website" value="{{ current.website }}" placeholder="https://yourbusiness.com" />
      </div>
    </div>
    <button type="submit" class="btn btn-gold" style="margin-top:8px">Save Business Info</button>
  </form>
</div>
{% endblock %}
