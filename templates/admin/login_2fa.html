<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#16213a" />
  <title>Verify — {{ BIZ }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='akye.css') }}" />
  <style>
    body {
      background:var(--ink); min-height:100vh; display:flex;
      align-items:center; justify-content:center; padding:var(--s5);
    }
    .login-card {
      background:var(--surface); border-radius:var(--r-lg);
      padding:var(--s10) var(--s8); width:100%; max-width:390px;
      box-shadow:0 24px 64px rgba(0,0,0,.34);
    }
    .brand { text-align:center; margin-bottom:var(--s6); }
    .brand .script {
      display:block; font-size:var(--t-2xl); font-weight:700;
      letter-spacing:-.025em; color:var(--ink); line-height:1.15;
    }
    .brand .sub {
      display:block; font-size:var(--t-xs); letter-spacing:.2em;
      text-transform:uppercase; color:var(--softer);
      font-weight:600; margin-top:var(--s2);
    }
    p.lead { color:var(--muted); font-size:var(--t-sm); line-height:1.55;
              margin:0 0 var(--s5); text-align:center; }
    .login-card label {
      display:block; font-weight:600; font-size:var(--t-sm);
      color:var(--ink); margin-bottom:var(--s2);
    }
    .login-card input {
      width:100%; padding:var(--s3) var(--s4);
      border:1px solid var(--line); border-radius:var(--r-sm);
      font-size:var(--t-lg); font-family:inherit; color:var(--ink);
      background:var(--surface); outline:none; margin-bottom:var(--s4);
      text-align:center; letter-spacing:.3em;
      transition:border-color var(--ease), box-shadow var(--ease);
    }
    .login-card input:focus { border-color:var(--amber); box-shadow:var(--ring); }
    .login-card button {
      width:100%; margin-top:var(--s2); padding:var(--s3);
      border:1px solid var(--amber); border-radius:var(--r-pill);
      background:var(--amber); color:#fff;
      font-size:var(--t-md); font-weight:650; font-family:inherit; cursor:pointer;
      transition:background var(--ease), transform var(--ease);
    }
    .login-card button:hover { background:var(--amber-deep); border-color:var(--amber-deep); }
    .login-card button:active { transform:translateY(1px); }
    .error {
      background:var(--warn-soft); color:var(--warn);
      border:1px solid #f6cfcf; border-radius:var(--r-sm);
      padding:var(--s3) var(--s4); font-size:var(--t-sm);
      font-weight:600; margin-bottom:var(--s4);
    }
    .back {
      display:block; margin-top:var(--s5); text-align:center;
      color:var(--muted); text-decoration:none; font-size:var(--t-sm);
    }
    .back:hover { color:var(--ink); text-decoration:underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <span class="script">{{ BIZ }}</span>
      <span class="sub">Verify it's you</span>
    </div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <p class="lead">Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
    <form method="POST">
      <input type="text" name="totp_code" inputmode="numeric" autocomplete="one-time-code"
             maxlength="8" autofocus required
             placeholder="123456" />
      <button type="submit">Verify</button>
    </form>
    <a href="{{ url_for('admin.login') }}" class="back">Back to sign in</a>
  </div>
</body>
</html>
