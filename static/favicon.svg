<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Akye">
  <!-- The tab icon. Deep navy ground, amber mark: the same two colours the
       whole product is built from, so a tab among thirty other tabs is
       recognisable at 16 pixels. -->
  <rect width="64" height="64" rx="14" fill="#16213a"/>
  <path d="M20 45 L32 19 L44 45" fill="none" stroke="#f0a44b"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="47.5" cy="44" r="4.5" fill="#f0a44b"/>
</svg>
