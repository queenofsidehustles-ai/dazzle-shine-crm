name: Mobile accessibility golden journeys

on:
  push:
    branches:
      - akye-launch-readiness/cohort-30
  workflow_dispatch:

concurrency:
  group: mobile-accessibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  golden-journeys:
    name: Local disposable CRM golden journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:////tmp/akye-golden.db
      SECRET_KEY: akye-golden-ci-only
      ADMIN_USER: e2e
      ADMIN_PASS: e2epass
      LOCAL_CRM: http://127.0.0.1:5001
      LOCAL_ADMIN_USER: e2e
      LOCAL_ADMIN_PASS: e2epass

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact candidate revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install application dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned browser test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start disposable local CRM
        run: |
          python -c "from app import create_app; create_app().run(host='127.0.0.1', port=5001)" > /tmp/akye-golden-server.log 2>&1 &
          echo $! > /tmp/akye-golden-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5001/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/akye-golden-server.log
          exit 1

      - name: Run mobile and accessibility golden journeys
        run: npm run test:golden

      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/akye-golden-server.log || true

      - name: Stop disposable local CRM
        if: always()
        run: |
          if [ -f /tmp/akye-golden-server.pid ]; then
            kill "$(cat /tmp/akye-golden-server.pid)" || true
          fi
