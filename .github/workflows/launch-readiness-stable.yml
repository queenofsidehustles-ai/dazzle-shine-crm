name: Akye Stable Launch Certification

on:
  push:
    branches:
      - akye-stable
  workflow_dispatch:

concurrency:
  group: akye-stable-launch-certification-${{ github.ref }}
  cancel-in-progress: false

env:
  TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/akye_launch_test

jobs:
  launch-certification:
    name: Exact-head P0 launch certification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: akye_launch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d akye_launch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact stable revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prove exact candidate SHA
        run: |
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Money display integrity
        run: python -m pytest -q tests/test_money_display_consistency.py tests/test_workorder_money_display.py tests/test_my_day_money_display.py --tb=short

      - name: Payment integrity
        run: |
          set -e
          for f in tests/test_charge.py tests/test_charge_timing.py tests/test_paid_receipt.py tests/test_price_raised_after_paid.py tests/test_payment_confirmation_integrity.py; do python "$f"; done
          python -m pytest -q tests/test_booking_payment_intent_integrity.py tests/test_stripe_webhook_tenant_isolation.py --tb=short

      - name: Tenant HTTP document export and media isolation
        run: |
          python -m pytest -q tests/test_tenant_session_and_object_isolation.py tests/test_tenant_http_object_isolation.py tests/test_tenant_secure_document_isolation.py tests/test_tenant_export_isolation.py tests/test_private_media_boundary.py tests/test_private_receipt_boundary.py tests/test_private_job_photo_contract.py tests/test_job_photo_immutability.py --tb=short

      - name: Tenant lifecycle and PostgreSQL isolation
        run: |
          python -m pytest -q tests/test_tenant_lifecycle_boundary.py tests/test_tenancy_cohort_30.py tests/test_tenant_pool_reuse_postgres.py tests/test_tenant_context_restoration.py tests/test_tenant_search_path_fail_closed.py tests/test_cohort_concurrency_postgres.py --tb=short

      - name: Backup restore containment
        env:
          PGURL: ${{ env.TEST_POSTGRES_URL }}
        run: python tests/test_backup_tenants.py

      - name: Scheduler cron provider and CSRF boundaries
        run: |
          python -m pytest -q tests/test_tenant_scheduler_isolation.py tests/test_cron_tenant_host_boundary.py tests/test_provider_webhook_boundary.py tests/test_cron_secret_transport.py tests/test_csrf_api_boundary.py --tb=short

      - name: Roles sessions signup and host boundaries
        run: |
          python -m pytest -q tests/test_role_fail_closed.py tests/test_operational_role_matrix.py tests/test_session_invalidation.py tests/test_signup_provisioning_safety.py tests/test_forwarded_host_tenant_boundary.py --tb=short
