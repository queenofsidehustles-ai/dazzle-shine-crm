# Run every company's automations, so no company has to run its own.
#
# On a single-business CRM the owner sets up their own cron job, which is right:
# they run the instance, so they run the clock. On Akye they do not run the
# instance. Asking a cleaning company owner to sign up for cron-job.org and
# paste six URLs is the self-hosted assumption leaking into a product where we
# are the host — and in practice the ones who never get round to it quietly send
# no reminders and charge no balances, and find out from a customer.
#
# So it runs here, the way ZenMaid and Jobber do it: one timetable, walking
# every company. A cleaning company signs up and its automations are already
# running, because there was never anything for it to switch on.
#
# ---------------------------------------------------------------------------
# Secrets. Settings → Secrets and variables → Actions:
#
#   AKYE_DATABASE_URL   Railway → Akye's Postgres → DATABASE_PUBLIC_URL.
#                       Only to read the list of companies; the jobs themselves
#                       run inside each company's own app.
#
#   REMINDER_API_KEY    The same value the Akye app has in Railway. If these two
#                       differ every call comes back 403 and it looks exactly
#                       like nothing running at all, so the script says so by
#                       name when it sees one.
# ---------------------------------------------------------------------------
name: Automations

on:
  schedule:
    # Charging a card is the one automation that cannot be undone, which is why
    # this stayed off until a business could say how it wants balances
    # collected. That per-business choice now exists (automations.balance_mode,
    # set from the Automations page) and is the actual safety gate: the
    # endpoint only charges anything for a business that has explicitly chosen
    # "auto" (automations.is_enabled('charge-balances')); "ask" (the default)
    # and "never" are untouched by this running. So turning the timetable back
    # on charges nobody who hasn't opted in -- it stops being a no-op only for
    # whoever already asked for it.
    - cron: '5 * * * *'
    # Everything else once a day, early enough that a day-before reminder
    # arrives the evening before rather than the morning of.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      cadence:
        description: Which timetable to run by hand
        type: choice
        options: [daily, hourly]
        default: daily
      only:
        description: A single company slug, for testing. Blank runs all.
        type: string
        default: ''

concurrency:
  group: automations
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Exact-release provenance matters for a launch gate. Do not silently
      # substitute a hard-coded branch here: checkout must use the same ref/SHA
      # that triggered this workflow. For a scheduled run GitHub supplies the
      # default-branch commit containing the workflow; for workflow_dispatch it
      # uses the selected ref. That makes the code that runs auditable from the
      # workflow run itself instead of being an implicit second release.
      - uses: actions/checkout@v4

      - name: Record scheduler source revision
        run: |
          echo "scheduler_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "Scheduler source: $(git rev-parse HEAD)"
        id: source

      # Does the code charging the cards match the code serving the pages?
      #
      # A scheduled workflow runs from the default branch, always. Production
      # runs whichever branch Railway is pointed at, which is a dashboard
      # setting this repository cannot see. Those are two independent choices
      # and nothing made them agree: on 2026-10-07 the default branch was
      # `main` and production reported `akye-stable`, 24 commits apart, and
      # the only reason it worked is that scheduler.py happened to be
      # identical on both.
      #
      # Comparing the two commits would warn on every run and be ignored
      # within a week, because under a two-line release model they are
      # *supposed* to differ. So this compares only the files that decide what
      # the scheduler does, against the branch production names itself at
      # /version -- no branch is hard-coded here, for the same reason the
      # checkout above does not hard-code one.
      #
      # It warns and does not fail. A reporting check that can stop every
      # company's reminders and balance collection is a worse fault than the
      # drift it is reporting.
      - name: Check production is running this scheduler
        continue-on-error: true
        env:
          PRODUCT_HOST: www.akyehq.com
          # The scheduler, and the one job that moves money through it.
          WATCH: scheduler.py blueprints/api.py automations.py
        run: |
          set +e
          v=$(curl -fsS --max-time 20 "https://$PRODUCT_HOST/version")
          if [ -z "$v" ]; then
            echo "::warning::Could not read https://$PRODUCT_HOST/version — drift not checked."
            exit 0
          fi
          echo "Production: $v"
          deployed=$(printf '%s' "$v" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("channel",""))')
          build=$(printf '%s' "$v" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("build",""))')
          here=$(git rev-parse --short HEAD)
          {
            echo "### Scheduler vs production"
            echo ""
            echo "| | branch | build |"
            echo "|---|---|---|"
            echo "| this run | \`${GITHUB_REF_NAME}\` | \`${here}\` |"
            echo "| production | \`${deployed}\` | \`${build}\` |"
          } >> $GITHUB_STEP_SUMMARY
          if [ -z "$deployed" ] || [ "$deployed" = "$GITHUB_REF_NAME" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Same line — nothing to compare." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git fetch --depth=1 origin "$deployed" 2>/dev/null
          if [ $? -ne 0 ]; then
            echo "::warning::Production reports branch '$deployed', which could not be fetched."
            exit 0
          fi
          drift=""
          for f in $WATCH; do
            git diff --quiet FETCH_HEAD HEAD -- "$f" || drift="$drift $f"
          done
          if [ -n "$drift" ]; then
            echo "::warning::Scheduler differs from deployed branch '$deployed' in:$drift"
            {
              echo ""
              echo "⚠️ **Divergence in the files that decide what this scheduler does:**"
              for f in $drift; do echo "- \`$f\`"; done
              echo ""
              echo "This run drives production from code production is not serving."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Different branches, same scheduler." >> $GITHUB_STEP_SUMMARY
          fi
          exit 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Work out which timetable this is
        id: which
        run: |
          if [ -n "${{ inputs.cadence }}" ]; then
            echo "cadence=${{ inputs.cadence }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "5 * * * *" ]; then
            echo "cadence=hourly" >> $GITHUB_OUTPUT
          else
            echo "cadence=daily" >> $GITHUB_OUTPUT
          fi

      - name: Run them
        env:
          AKYE_DATABASE_URL: ${{ secrets.AKYE_DATABASE_URL }}
          REMINDER_API_KEY: ${{ secrets.REMINDER_API_KEY }}
          BASE_DOMAIN: akyehq.com
        run: |
          python3 scheduler.py --cadence ${{ steps.which.outputs.cadence }} \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            | tee run.log

      - name: Say what happened
        if: always()
        run: |
          echo "### Automations — ${{ steps.which.outputs.cadence }}" >> $GITHUB_STEP_SUMMARY
          echo "Scheduler source: ${{ steps.source.outputs.scheduler_sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -40 run.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no output)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
