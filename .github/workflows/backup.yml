# Back the live databases up every night, somewhere that is not Railway.
#
# The point of running this here rather than as a Railway cron job is that
# GitHub is a different company. A backup that lives beside the thing it is
# backing up covers a dropped table and nothing else; it does not cover the
# account being suspended, the project being deleted, or the provider having a
# bad day. This runs on someone else's computer and stores the result on a
# third someone's.
#
# Every run also restores what it just made and counts the rows back. A backup
# nobody has restored is a file, not a backup, and the difference always shows
# up at the worst possible moment.
#
# ---------------------------------------------------------------------------
# TWO DATABASES, not one.
#
# For a year this job backed up one database, and after Akye launched that one
# database was still the cleaning company's. Every company paying to use the
# platform had its clients, jobs, cleaners and pay records in a database with
# no backup at all, and the job went green every night saying so.
#
# Each database below is backed up by its own job, from its own branch —
# because the restore rebuilds tables from models.py, and the two products do
# not have the same models. Restoring Akye from a `main` checkout would quietly
# drop every table Akye added.
# ---------------------------------------------------------------------------
# Secrets. Settings → Secrets and variables → Actions:
#
#   BACKUP_DATABASE_URL        Dazzle & Shine's Postgres → DATABASE_PUBLIC_URL
#   BACKUP_AKYE_DATABASE_URL   Akye's Postgres → DATABASE_PUBLIC_URL
#
#                         Both MUST be the public one. The internal
#                         *.railway.internal address only resolves inside
#                         Railway, so an internal URL here fails every night
#                         with a DNS error.
#
#   BACKUP_PASSPHRASE     A long random string. The backups hold client home
#                         addresses, access notes and pay records, so they are
#                         encrypted before they leave this job. Keep a copy of
#                         this passphrase somewhere that is not this repo and
#                         not your laptop — without it the backups are noise.
# ---------------------------------------------------------------------------
name: Nightly backup

on:
  schedule:
    - cron: '0 8 * * *'      # 08:00 UTC — small hours in the US
  workflow_dispatch:          # and on demand, from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read           # to read the previous run's manifest

    strategy:
      # One database failing must not cancel the other's backup. They are
      # different businesses and they fail for different reasons.
      fail-fast: false
      matrix:
        include:
          - key: dazzle
            label: Dazzle & Shine — your own CRM
            ref: main
            secret: BACKUP_DATABASE_URL
          - key: akye
            label: Akye — every cleaning company on the platform
            ref: akye-stable
            secret: BACKUP_AKYE_DATABASE_URL

    name: ${{ matrix.key }}

    # Per database. Two backups of the SAME database racing would compare
    # against each other's manifests and reach confusing conclusions; two
    # backups of different databases are simply unrelated.
    concurrency:
      group: nightly-backup-${{ matrix.key }}
      cancel-in-progress: false

    # A throwaway Postgres to restore into. SQLite cannot hold a database that
    # has a schema per company, so verifying Akye against it would drop every
    # company and call the difference a failure.
    services:
      scratch:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Each product restores with its own models, so each checks out its own
      # branch. This is the line that keeps Akye's tables from being silently
      # dropped by a restore running against the single-business models.
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # Said plainly and early. A missing connection string is the one failure
      # that would otherwise look like "nothing to do" rather than "this
      # business has no backup".
      - name: Check there is a database to back up
        env:
          URL: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::${{ matrix.secret }} is not set, so '${{ matrix.label }}' is NOT being backed up."
            echo "::error::Add it under Settings → Secrets and variables → Actions."
            echo "::error::The value is Railway → that project's Postgres → Variables → DATABASE_PUBLIC_URL."
            exit 1
          fi

      # The size check compares tonight against last night. Without the
      # previous manifest every run looks like the first one, and a database
      # that emptied itself would back up cleanly and pass.
      #
      # Named per database. One shared manifest would have each product
      # comparing its row counts against the other's, which is worse than no
      # comparison at all.
      - name: Fetch last night's manifest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p backups
          run_id=$(gh run list --workflow=backup.yml --status=success \
                     --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name backup-manifest-${{ matrix.key }} --dir backups || true
            echo "Comparing against run $run_id"
          else
            echo "No previous successful run — first backup, nothing to compare."
          fi

      - name: Back up, and prove it restores
        env:
          DATABASE_URL: ${{ secrets[matrix.secret] }}
          BACKUP_VERIFY_URL: postgresql://postgres:verify@localhost:5432/verify
          SECRET_KEY: backup-job-does-not-serve-requests
        run: python3 backup.py --dir backups --verify

      # Encrypted before it goes anywhere. Decrypt with:
      #   openssl enc -d -aes-256-cbc -pbkdf2 -in FILE.enc -out FILE.json.gz
      # Runs even when the checks refused the backup. A suspicious file is still
      # evidence, and it is customer data either way, so it does not sit around
      # unencrypted while somebody works out what happened.
      - name: Encrypt
        if: always()
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ]; then
            echo "::error::BACKUP_PASSPHRASE is not set. Refusing to upload customer data unencrypted."
            exit 1
          fi
          cd backups
          for f in backup-*.json.gz; do
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$f" -out "$f.enc" -pass env:PASS
            rm "$f"
          done
          ls -la

      - name: Upload the backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ matrix.key }}-${{ github.run_number }}
          path: backups/*.enc
          retention-days: 30
          if-no-files-found: ignore

      # Row counts only — no customer data — so it can be kept far longer and
      # read by the next run without decrypting anything.
      #
      # Uploaded even on a failed run, and this is the important part. The
      # comparison is "what changed since last time", and the baseline used to
      # advance only when a run succeeded — so one deliberate change, a company
      # closed and its schema removed, made every following night compare
      # against the same stale manifest and fail again. A backup job that is
      # permanently red is one nobody reads, which is worse than no check.
      #
      # Recording what was actually there tonight means the alarm rings once,
      # for the night something changed, and a database that keeps shrinking
      # rings again each night it shrinks further. Which is what a change
      # detector is for.
      - name: Upload the manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-manifest-${{ matrix.key }}
          path: backups/*.manifest.json
          retention-days: 90
          overwrite: true
          if-no-files-found: ignore

      - name: Say what happened
        if: always()
        run: |
          echo "### ${{ matrix.label }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json, glob
          m = json.load(open(sorted(glob.glob('backups/*.manifest.json'))[-1]))
          tenants = m.get('tenants') or []
          print(f\"{m['total_rows']:,} rows, {m['bytes']/1024:.0f} KB\")
          if tenants:
              print(f\"{len(tenants)} companies, {m.get('tenant_rows', 0):,} rows between them\")
          for t, n in sorted(m['counts'].items(), key=lambda kv: -kv[1]):
              if n: print(f'  {t:<28} {n:>7,}')
          for schema in tenants:
              rows = m.get('tenant_counts', {}).get(schema, {})
              print(f\"  {schema:<28} {sum(rows.values()):>7,}\")
          " >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
