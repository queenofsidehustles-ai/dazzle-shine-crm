name: Launch Readiness

on:
  push:
    branches:
      - akye-launch-readiness/cohort-30
  pull_request:
    branches:
      - akye-stable
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical-gates:
    name: Critical launch gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: akye_test
          POSTGRES_PASSWORD: akye_test
          POSTGRES_DB: akye_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akye_test -d akye_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_POSTGRES_URL: postgresql://akye_test:akye_test@localhost:5432/akye_test
      SECRET_KEY: launch-readiness-ci-secret-key-at-least-32-characters
      FLASK_ENV: development

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record candidate SHA
        run: |
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Testing candidate $(git rev-parse HEAD)"
        id: candidate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: PAY-01 exact money display
        id: pay01
        continue-on-error: true
        run: |
          python -m pytest -q \
            tests/test_money_display_consistency.py \
            tests/test_workorder_money_display.py \
            tests/test_my_day_money_display.py \
            --tb=short

      - name: PAY-02 payment integrity
        id: pay02
        continue-on-error: true
        run: |
          python -m pytest -q \
            tests/test_booking_payment_intent_integrity.py \
            tests/test_payment_confirmation_integrity.py \
            tests/test_stripe_webhook_tenant_isolation.py \
            --tb=short

      - name: Tenant session, object, document, export and media isolation
        id: tenant_http
        continue-on-error: true
        run: |
          python -m pytest -q \
            tests/test_tenant_session_and_object_isolation.py \
            tests/test_tenant_http_object_isolation.py \
            tests/test_tenant_public_token_isolation.py \
            tests/test_tenant_secure_document_isolation.py \
            tests/test_tenant_export_isolation.py \
            tests/test_private_media_boundary.py \
            tests/test_private_receipt_boundary.py \
            tests/test_private_job_photo_contract.py \
            tests/test_job_photo_immutability.py \
            --tb=short

      - name: Tenant lifecycle boundary
        id: tenant_lifecycle
        continue-on-error: true
        run: python -m pytest -q tests/test_tenant_lifecycle_boundary.py --tb=short

      - name: TEN-06 diagnostic — active tenant
        if: always() && steps.tenant_lifecycle.outcome != 'success'
        continue-on-error: true
        run: python -m pytest -vv tests/test_tenant_lifecycle_boundary.py::test_active_tenant_resolves_to_control_plane_schema_and_keeps_session --tb=short

      - name: TEN-06 diagnostic — suspension
        if: always() && steps.tenant_lifecycle.outcome != 'success'
        continue-on-error: true
        run: python -m pytest -vv tests/test_tenant_lifecycle_boundary.py::test_suspension_denies_access_and_clears_presented_session --tb=short

      - name: TEN-06 diagnostic — reactivation
        if: always() && steps.tenant_lifecycle.outcome != 'success'
        continue-on-error: true
        run: python -m pytest -vv tests/test_tenant_lifecycle_boundary.py::test_reactivation_restores_workspace_but_not_stale_pre_suspension_login --tb=short

      - name: TEN-06 diagnostic — missing closed unknown
        if: always() && steps.tenant_lifecycle.outcome != 'success'
        continue-on-error: true
        run: python -m pytest -vv tests/test_tenant_lifecycle_boundary.py::test_missing_closed_or_unknown_tenant_is_not_resolvable --tb=short

      - name: TEN-06 diagnostic — control plane read failure
        if: always() && steps.tenant_lifecycle.outcome != 'success'
        continue-on-error: true
        run: python -m pytest -vv tests/test_tenant_lifecycle_boundary.py::test_control_plane_read_failure_is_503_not_implicit_access --tb=short

      - name: TEN-06 diagnostic — mismatched schema
        if: always() && steps.tenant_lifecycle.outcome != 'success'
        continue-on-error: true
        run: python -m pytest -vv tests/test_tenant_lifecycle_boundary.py::test_active_tenant_with_mismatched_schema_assignment_fails_closed --tb=short

      - name: TEN-06 diagnostic — missing schema
        if: always() && steps.tenant_lifecycle.outcome != 'success'
        continue-on-error: true
        run: python -m pytest -vv tests/test_tenant_lifecycle_boundary.py::test_active_tenant_with_missing_schema_assignment_fails_closed --tb=short

      - name: PostgreSQL tenant and pool isolation
        id: tenant_pg
        continue-on-error: true
        run: |
          python -m pytest -q \
            tests/test_tenancy_cohort_30.py \
            tests/test_tenant_pool_reuse_postgres.py \
            tests/test_tenant_context_restoration.py \
            tests/test_tenant_search_path_fail_closed.py \
            --tb=short

      - name: Tenant scheduler isolation
        id: sched_iso
        continue-on-error: true
        run: python -m pytest -q tests/test_tenant_scheduler_isolation.py --tb=short

      - name: Cron tenant host boundary
        id: cron_host
        continue-on-error: true
        run: python -m pytest -q tests/test_cron_tenant_host_boundary.py --tb=short

      - name: Provider webhook boundary
        id: provider_webhook
        continue-on-error: true
        run: python -m pytest -q tests/test_provider_webhook_boundary.py --tb=short

      - name: Cron secret transport
        id: cron_secret
        continue-on-error: true
        run: python -m pytest -q tests/test_cron_secret_transport.py --tb=short

      - name: CSRF API boundary
        id: csrf_api
        continue-on-error: true
        run: python -m pytest -q tests/test_csrf_api_boundary.py --tb=short

      - name: Role fail closed
        id: role_fail
        continue-on-error: true
        run: python -m pytest -q tests/test_role_fail_closed.py --tb=short

      - name: Signup provisioning safety
        id: signup
        continue-on-error: true
        run: python -m pytest -q tests/test_signup_provisioning_safety.py --tb=short

      - name: Forwarded host tenant boundary
        id: forwarded_host
        continue-on-error: true
        run: python -m pytest -q tests/test_forwarded_host_tenant_boundary.py --tb=short

      - name: Candidate summary
        if: always()
        run: |
          echo "## Launch-readiness candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: ${{ steps.candidate.outputs.candidate_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch/ref: ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live funds authorized: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- PAY-01 exact money display: ${{ steps.pay01.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PAY-02 payment integrity: ${{ steps.pay02.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tenant HTTP/session/documents/exports/media: ${{ steps.tenant_http.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tenant lifecycle boundary: ${{ steps.tenant_lifecycle.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PostgreSQL tenancy/pool: ${{ steps.tenant_pg.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tenant scheduler isolation: ${{ steps.sched_iso.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cron tenant host boundary: ${{ steps.cron_host.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provider webhook boundary: ${{ steps.provider_webhook.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cron secret transport: ${{ steps.cron_secret.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CSRF API boundary: ${{ steps.csrf_api.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Role fail closed: ${{ steps.role_fail.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signup provisioning safety: ${{ steps.signup.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Forwarded host tenant boundary: ${{ steps.forwarded_host.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose PAY-01 gate failure
        if: always() && steps.pay01.outcome != 'success'
        run: exit 1
      - name: Diagnose PAY-02 gate failure
        if: always() && steps.pay02.outcome != 'success'
        run: exit 1
      - name: Diagnose tenant HTTP/media gate failure
        if: always() && steps.tenant_http.outcome != 'success'
        run: exit 1
      - name: Diagnose tenant lifecycle gate failure
        if: always() && steps.tenant_lifecycle.outcome != 'success'
        run: exit 1
      - name: Diagnose PostgreSQL tenancy gate failure
        if: always() && steps.tenant_pg.outcome != 'success'
        run: exit 1
      - name: Diagnose tenant scheduler isolation failure
        if: always() && steps.sched_iso.outcome != 'success'
        run: exit 1
      - name: Diagnose cron tenant host boundary failure
        if: always() && steps.cron_host.outcome != 'success'
        run: exit 1
      - name: Diagnose provider webhook boundary failure
        if: always() && steps.provider_webhook.outcome != 'success'
        run: exit 1
      - name: Diagnose cron secret transport failure
        if: always() && steps.cron_secret.outcome != 'success'
        run: exit 1
      - name: Diagnose CSRF API boundary failure
        if: always() && steps.csrf_api.outcome != 'success'
        run: exit 1
      - name: Diagnose role fail closed failure
        if: always() && steps.role_fail.outcome != 'success'
        run: exit 1
      - name: Diagnose signup provisioning safety failure
        if: always() && steps.signup.outcome != 'success'
        run: exit 1
      - name: Diagnose forwarded host tenant boundary failure
        if: always() && steps.forwarded_host.outcome != 'success'
        run: exit 1

      - name: Enforce launch gates
        if: always()
        run: |
          failed=0
          for result in \
            "${{ steps.pay01.outcome }}" \
            "${{ steps.pay02.outcome }}" \
            "${{ steps.tenant_http.outcome }}" \
            "${{ steps.tenant_lifecycle.outcome }}" \
            "${{ steps.tenant_pg.outcome }}" \
            "${{ steps.sched_iso.outcome }}" \
            "${{ steps.cron_host.outcome }}" \
            "${{ steps.provider_webhook.outcome }}" \
            "${{ steps.cron_secret.outcome }}" \
            "${{ steps.csrf_api.outcome }}" \
            "${{ steps.role_fail.outcome }}" \
            "${{ steps.signup.outcome }}" \
            "${{ steps.forwarded_host.outcome }}"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more launch-readiness gates failed."
            exit 1
          fi
          echo "All configured launch-readiness gates passed."
