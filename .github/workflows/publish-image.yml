# Publish the customer image on every release.
#
# Customers deploy an image, not the source: they get every release and never
# get the code. release.py tags a release, the tag lands here, and this builds
# and pushes it to the GitHub Container Registry.
#
# Two tags are pushed for every release:
#   ghcr.io/<owner>/<repo>:v2026.08.19.2  — that exact release, for pinning
#   ghcr.io/<owner>/<repo>:stable         — what customer services follow
#
# Nothing here needs a secret: GITHUB_TOKEN is issued to the run itself.
name: Publish customer image

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # so it can be run by hand if a release needs rebuilding

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Work out what we are publishing
        id: meta
        run: |
          # Lower-case: image names may not contain capitals, and the owner has one.
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build it and RUN it before anybody gets it. An image that builds fine
      # and then dies on boot is the failure that matters, and the only way to
      # know is to start it and ask it a question.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          # The Dockerfile deliberately does NOT live at the repo root: Railway
          # prefers a root Dockerfile over railway.toml's nixpacks builder, so
          # its presence silently changed how this business's own production
          # instance was built — and took the site down.
          file: docker/Dockerfile
          load: true
          tags: crm:smoketest
          build-args: |
            RELEASE_TAG=${{ steps.meta.outputs.tag }}
            RELEASE_SHA=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — does it actually boot and answer?
        run: |
          docker run -d --name crm-smoke -p 8080:8080 \
            -e SECRET_KEY=smoketest \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            crm:smoketest
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/version > /tmp/version.json 2>/dev/null; then
              echo "Answered after ${i}s:"
              cat /tmp/version.json
              echo
              grep -q '"release":"${{ steps.meta.outputs.tag }}"' /tmp/version.json \
                || { echo "::error::image does not report the release it was built from"; exit 1; }
              grep -q '"channel":"stable"' /tmp/version.json \
                || { echo "::error::image does not report the stable channel"; exit 1; }
              curl -fsS http://localhost:8080/login > /dev/null \
                || { echo "::error::the login page does not render"; exit 1; }
              echo "✅ boots, serves /version and /login"
              docker rm -f crm-smoke > /dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::image never answered on :8080 — here is why:"
          docker logs crm-smoke
          exit 1

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:stable
          build-args: |
            RELEASE_TAG=${{ steps.meta.outputs.tag }}
            RELEASE_SHA=${{ steps.meta.outputs.sha }}
          cache-from: type=gha

      - name: Say what was published
        run: |
          echo "### Published \`${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Customer services following \`:stable\` will pull this on their next deploy." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:stable" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
